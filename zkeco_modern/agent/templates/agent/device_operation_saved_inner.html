<div
  data-access-saved="1"
  data-close-delay-ms="{{ close_delay_ms|default:'250' }}"
  data-action-state="{{ action_state|default:'success'|escape }}"
  data-action-title="{{ action_title|default:'OK'|escape }}"
  data-action-message="{{ action_message|default:message|default:'OK'|escape }}"
  style="background:#0a1a27;border:1px solid #2f5876;border-radius:2px;padding:8px;">
  <div style="color:#9fd2f1;font-weight:900;font-size:11px;letter-spacing:0.2px;text-transform:uppercase;">{{ action_title|default:'OK' }}</div>
  <div style="color:#e8f0f8;font-size:10px;margin-top:4px;">{{ action_message|default:message|default:'OK' }}</div>
</div>
