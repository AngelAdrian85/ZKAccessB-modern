<style>
  .access-saved{background:#0a1a27;border:1px solid #2f5876;border-radius:6px;padding:14px;}
  .access-saved h3{margin:0 0 8px 0;color:#9fd2f1;font-size:14px;}
  .access-saved p{margin:0;color:#e8f0f8;font-size:11px;}
  .access-saved .actions{margin-top:12px;display:flex;gap:10px;justify-content:flex-end;}
  .access-saved .btn{padding:7px 13px;border:none;border-radius:4px;font-size:11px;font-weight:900;cursor:pointer;color:#fff;}
  .access-saved .btn-primary{background:#3da5d9;}
  .access-saved .btn-secondary{background:#2f5876;}
</style>

<div class="access-saved" data-access-saved="1"
     data-action-state="success"
     data-action-title="ACCES SALVAT"
  data-action-message="Nivelul de acces a fost salvat. Sincronizare către centrale: queued={{ queued_sync|default:0 }}{% if already_sync %}, deja în așteptare={{ already_sync }}{% endif %} (SYNC)."
     data-close-delay-ms="350">
  <h3>Nivelul {{ obj.name }} {% if created %}creat{% else %}actualizat{% endif %}</h3>
  <p>Modificarea a fost salvată.</p>
  <p style="margin-top:6px;" class="hint">Sincronizare către centrale (SYNC): queued={{ queued_sync|default:0 }}{% if already_sync %}, deja în așteptare={{ already_sync }}{% endif %}.</p>
  <div class="actions">
    <button type="button" class="btn btn-secondary" data-modal-close="1">Închide</button>
    <button type="button" class="btn btn-primary" data-modal-close="1">Actualizează lista</button>
  </div>
</div>
