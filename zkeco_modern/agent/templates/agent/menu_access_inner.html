<style>
  .access-module-container{max-width:98%;margin:6px auto;background:#1e4a6b;padding:6px;border-radius:2px;border:2px solid #3da5d9;}
  .access-container{padding:0;margin:0 auto;}
  .access-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 6px 0;flex-wrap:wrap;}
  .access-title{color:#7db3d9;border-bottom:1px solid #3da5d9;padding-bottom:4px;margin:0;font-size:13px;font-weight:bold;flex:1;}
  /* Tabs (PERSONAL screenshot style) */
  .access-tabs{display:flex;gap:2px;margin-bottom:6px;border-bottom:1px solid #3d6a8b;overflow-x:auto;}
  .access-tab-btn{padding:4px 12px;background:#163247;border:1px solid #3d6a8b;border-bottom:none;color:#9fd2f1;cursor:pointer;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;border-radius:2px 2px 0 0;transition:all 0.2s;white-space:nowrap;flex:0 0 auto;}
  .access-tab-btn:hover{color:#7db3d9;}
  .access-tab-btn.is-active{background:#3da5d9;color:#fff;border-color:#3da5d9;}

  .access-body{border:1px solid #3d6a8b;border-radius:2px;overflow:hidden;background:transparent;}
  .td-center-muted{text-align:center;color:var(--text-muted);}

  .access-pane{padding:6px;}
  .access-pane .action-bar{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-bottom:4px;padding:4px 6px;background:#163247;border:1px solid #3d6a8b;border-radius:2px;}
  .access-pane .action-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .access-badge{padding:2px 8px;border-radius:999px;font-size:10px;font-weight:900;background:rgba(61,165,217,0.25);border:1px solid rgba(61,165,217,0.35);color:#e8f1f8;}
  .access-pane .hint{color:var(--text-muted);font-size:12px;}
  .btn-small{padding:3px 8px;border-radius:2px;font-weight:600;font-size:9px;border:1px solid #3d6a8b;cursor:pointer;display:inline-flex;align-items:center;gap:3px;}

  .access-pager{margin-top:8px;display:flex;align-items:center;justify-content:flex-end;gap:8px;color:#cfe9f8;font-size:11px;flex-wrap:wrap;}
  .access-pager a{color:#cfe9f8;text-decoration:none;}

  .col-w-150{width:150px;}

  /* Modal: EXACT like screenshot 2 (legacy device modal) */
  #modalAccess.modal-backdrop,#modalAccessLogs.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.72);display:none;align-items:center;justify-content:center;z-index:2500;padding:12px;opacity:0;transition:opacity 160ms ease;}
  #modalAccess.modal-backdrop.is-open,#modalAccessLogs.modal-backdrop.is-open{opacity:1;}
  /* Ultra-compact modal size (legacy-like) */
  #modalAccess .modal,#modalAccessLogs .modal{width:min(860px, calc(100vw - 28px));max-height:92vh;background:#1e4a6b;border:2px solid #3da5d9;border-radius:2px;box-shadow:0 20px 50px rgba(0,0,0,0.55);overflow:hidden;display:flex;flex-direction:column;transform:translateY(10px) scale(0.985);opacity:0;transition:transform 180ms ease, opacity 180ms ease, box-shadow 180ms ease;}
  #modalAccess.modal-backdrop.is-open .modal,#modalAccessLogs.modal-backdrop.is-open .modal{transform:translateY(0) scale(1);opacity:1;}
  #modalAccess .modal-header,#modalAccessLogs .modal-header{background:#163247;border-bottom:1px solid #3da5d9;padding:4px 6px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#7db3d9;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;position:relative;}
  #modalAccess .modal-header::before,#modalAccess .modal-header::after,#modalAccessLogs .modal-header::before,#modalAccessLogs .modal-header::after{display:none;content:none;}
  #modalAccess .modal-title,#modalAccessLogs .modal-title{text-align:left;flex:1;}
  #modalAccess .modal-title::before,#modalAccessLogs .modal-title::before{content:"+ ";color:#9fd2f1;}
  #modalAccess .modal-close,#modalAccessLogs .modal-close{background:#163247;border:1px solid #3d6a8b;color:#9fd2f1;width:22px;height:22px;border-radius:2px;cursor:pointer;font-weight:700;font-size:14px;}
  #modalAccess .modal-close:hover,#modalAccessLogs .modal-close:hover{background:#3da5d9;border-color:#3da5d9;color:#fff;}
  #modalAccess .modal-body,#modalAccessLogs .modal-body{padding:6px;overflow:auto;color:#e8f0f8;}
  #modalAccess .modal-body{overflow-x:hidden;}

  /* Shared form chrome used by door/device inner forms (prevents broken layout in Access modals) */
  #modalAccess .section{border:1px solid rgba(61,106,139,0.85);border-radius:2px;padding:8px;background:#0f2433;margin-bottom:8px;}
  #modalAccess .section h4{color:#9fd2f1;font-weight:900;font-size:12px;}
  #modalAccess .grid-3{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px;}
  #modalAccess .grid-3 > *{min-width:0;}
  @media (max-width: 780px){
    #modalAccess .grid-3{grid-template-columns:1fr;}
  }
  #modalAccess .field{display:flex;flex-direction:column;gap:4px;font-size:11px;min-width:0;}
  #modalAccess .field label{font-size:9px;color:#9fd2f1;display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:0.2px;font-weight:800;}
  #modalAccess .field input,
  #modalAccess .field select,
  #modalAccess .field textarea{width:100%;max-width:100%;min-width:0;padding:5px 7px;border:1px solid #3d6a8b;background:#0a1a27;color:#e8f0f8;border-radius:2px;}
  #modalAccess .radio-row{display:flex;gap:14px;align-items:center;margin-top:4px;flex-wrap:wrap;}
  #modalAccess .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;flex-wrap:wrap;}
  #modalAccess .inline-msg{font-weight:900;font-size:11px;}
  #modalAccess .inline-msg.error{color:#ffbdbd;}
  #modalAccess .inline-msg.loading{color:#7db3d9;}
  #modalAccess .btn-primary,
  #modalAccess .btn-secondary{padding:4px 10px;border-radius:2px;font-weight:900;font-size:10px;border:1px solid #3d6a8b;cursor:pointer;display:inline-flex;align-items:center;gap:4px;}
  #modalAccess .btn-primary{background:#3da5d9;border-color:#2c8ec0;color:#fff;}
  #modalAccess .btn-primary:hover{background:#2c8ec0;}
  #modalAccess .btn-secondary{background:#2d5a7b;border-color:#3d6a8b;color:#fff;}
  #modalAccess .btn-secondary:hover{background:#3d6a8b;}

  /* Door Configuration: "More..." dropdown (rendered in body to avoid clipping) */
  .access-more-menu{position:fixed;display:none;min-width:260px;max-width:360px;background:#163247;border:2px solid #3da5d9;border-radius:2px;box-shadow:0 12px 26px rgba(0,0,0,0.55);z-index:3000;padding:2px;}
  .access-more-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 10px;border:none;background:transparent;color:#e8f0f8;font-size:12px;font-weight:700;cursor:pointer;}
  .access-more-item:hover{background:rgba(61,165,217,0.25);}
  .access-more-bullet{width:6px;height:6px;background:#3da5d9;border-radius:1px;flex:0 0 auto;}

  /* simple table chrome inside logs modal */
  #modalAccessLogs table{width:100%;border-collapse:collapse;font-size:10px;background:#163247;color:#e8f0f8;}
  #modalAccessLogs thead{background:linear-gradient(to bottom, #3da5d9 0%, #2d7ba5 100%);color:#fff;}
  #modalAccessLogs th,#modalAccessLogs td{padding:4px 6px;border-bottom:1px solid rgba(61,106,139,0.65);border-right:1px solid rgba(61,106,139,0.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #modalAccessLogs th:last-child,#modalAccessLogs td:last-child{border-right:none;}
</style>

<script>
(function(){
  const tabBody = document.getElementById('accessTabBody');
  const badge = document.getElementById('accessActiveBadge');
  const buttons = Array.from(document.querySelectorAll('.access-tab-btn[data-tab]'));

  const modalBackdrop = document.getElementById('modalAccess');
  const modalBody = document.getElementById('modalAccessBody');
  const modalTitle = document.getElementById('modalAccessTitle');
  const modalClose = document.getElementById('modalAccessClose');

  const logsBackdrop = document.getElementById('modalAccessLogs');
  const logsTitle = document.getElementById('modalAccessLogsTitle');
  const logsClose = document.getElementById('modalAccessLogsClose');
  const logsHint = document.getElementById('modalAccessLogsHint');
  const logsBody = document.getElementById('modalAccessLogsBody');

  const TAB_META = {
    doors:     {label: 'Uși',             url: '/agent/crud/doors/?embed=1&mode=monitor'},
    doorconfig:{label: 'Configurare uși', url: '/agent/crud/doors/?embed=1&mode=config'},
    segments:{label: 'Intervale',  url: '/agent/crud/time-segments/?embed=1'},
    holidays:{label: 'Sărbători',  url: '/agent/crud/holidays/?embed=1'},
    levels:  {label: 'Niveluri',   url: '/agent/crud/access-levels/?embed=1'},
    personal_levels:{label: 'Nivel Acces personal', url: '/agent/crud/access-levels-personnel/?embed=1'},
    wiegand:{label: 'Wiegand',     url: '/agent/crud/wiegand-formats/?embed=1'},
    logs:    {label: 'Loguri',     url: '/agent/menu/reports/?tab=accesslog&embed=1'},
  };

  function getCookie(name){
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if(parts.length === 2) return parts.pop().split(';').shift();
    return '';
  }
  function getCSRF(){ return getCookie('csrftoken'); }

  let currentTab = null;
  let currentTabUrl = null;
  let currentModalUrl = null;

  function escapeHtml(value){
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function parseJsonText(text, fallback){
    try{ return JSON.parse(String(text || '')); }catch(_e){ return fallback; }
  }

  function getWiegandPane(){
    return tabBody ? tabBody.querySelector('[data-tab="wiegand"]') : null;
  }

  function getWiegandManualForm(){
    const pane = getWiegandPane();
    return pane ? pane.querySelector('form[data-wiegand-manual-form="1"]') : null;
  }

  function getWiegandPreviewEl(){
    const form = getWiegandManualForm();
    return form ? form.querySelector('[data-wiegand-preview="1"]') : null;
  }

  function getSelectedWiegandOption(){
    const form = getWiegandManualForm();
    if(!form) return null;
    const select = form.querySelector('[data-wiegand-manual-select="1"]');
    if(!select) return null;
    return select.options[select.selectedIndex] || null;
  }

  function getSelectedWiegandPayload(){
    const opt = getSelectedWiegandOption();
    if(!opt) return null;
    return parseJsonText(opt.getAttribute('data-payload') || '', null);
  }

  function getWiegandDoorSelect(){
    const form = getWiegandManualForm();
    return form ? form.querySelector('[data-wiegand-door-select="1"]') : null;
  }

  function getWiegandTestModal(){
    const pane = getWiegandPane();
    return pane ? pane.querySelector('[data-wiegand-test-modal="1"]') : null;
  }

  function getWiegandTestDoorSelect(){
    const modal = getWiegandTestModal();
    return modal ? modal.querySelector('[data-wiegand-test-door="1"]') : null;
  }

  function getWiegandTestStatusEl(){
    const modal = getWiegandTestModal();
    return modal ? modal.querySelector('[data-wiegand-test-status="1"]') : null;
  }

  function getWiegandTestBody(){
    const modal = getWiegandTestModal();
    return modal ? modal.querySelector('[data-wiegand-test-body="1"]') : null;
  }

  function getWiegandTestStartBtn(){
    const modal = getWiegandTestModal();
    return modal ? modal.querySelector('[data-wiegand-test-start="1"]') : null;
  }

  function getWiegandTestStopBtn(){
    const modal = getWiegandTestModal();
    return modal ? modal.querySelector('[data-wiegand-test-stop="1"]') : null;
  }

  function readWiegandDoorOption(opt){
    if(!opt) return null;
    const id = String(opt.value || '').trim();
    if(!id) return null;
    return {
      id,
      deviceId: String(opt.getAttribute('data-device-id') || '').trim(),
      doorNumber: String(opt.getAttribute('data-door-number') || '').trim(),
      deviceName: String(opt.getAttribute('data-device-name') || '').trim(),
      doorName: String(opt.getAttribute('data-door-name') || '').trim(),
      label: String(opt.textContent || '').trim(),
    };
  }

  function getSelectedWiegandDoor(preferTestModal){
    const modal = getWiegandTestModal();
    const modalOpen = !!(modal && modal.style.display === 'flex');
    if(preferTestModal || modalOpen){
      const testSelect = getWiegandTestDoorSelect();
      if(testSelect){
        const selected = readWiegandDoorOption(testSelect.options[testSelect.selectedIndex] || null);
        if(selected) return selected;
      }
    }
    const manualSelect = getWiegandDoorSelect();
    if(!manualSelect) return null;
    return readWiegandDoorOption(manualSelect.options[manualSelect.selectedIndex] || null);
  }

  function syncWiegandDoorSelection(doorId, source){
    const wanted = String(doorId || '').trim();
    const manualSelect = getWiegandDoorSelect();
    const testSelect = getWiegandTestDoorSelect();
    [
      {select: manualSelect, key: 'manual'},
      {select: testSelect, key: 'test'},
    ].forEach(item => {
      if(!item.select || item.key === source) return;
      const next = Array.from(item.select.options || []).find(opt => String(opt.value || '').trim() === wanted);
      if(next){
        item.select.value = next.value;
      } else if(!wanted){
        item.select.value = '';
      }
    });
  }

  function ensureWiegandDoorDefaults(){
    const manualSelect = getWiegandDoorSelect();
    const testSelect = getWiegandTestDoorSelect();
    if(manualSelect && !String(manualSelect.value || '').trim()){
      const firstReal = Array.from(manualSelect.options || []).find(opt => String(opt.value || '').trim());
      if(firstReal){ manualSelect.value = firstReal.value; }
    }
    if(testSelect && !String(testSelect.value || '').trim()){
      const manualDoor = manualSelect ? String(manualSelect.value || '').trim() : '';
      if(manualDoor){
        testSelect.value = manualDoor;
      } else {
        const firstReal = Array.from(testSelect.options || []).find(opt => String(opt.value || '').trim());
        if(firstReal){ testSelect.value = firstReal.value; }
      }
    }
    const selectedValue = manualSelect && String(manualSelect.value || '').trim()
      ? String(manualSelect.value || '').trim()
      : (testSelect ? String(testSelect.value || '').trim() : '');
    if(selectedValue){
      syncWiegandDoorSelection(selectedValue, 'manual');
    }
  }

  function setWiegandPreview(content, isError){
    const preview = getWiegandPreviewEl();
    if(!preview) return;
    preview.style.color = isError ? '#ffbdbd' : '#d8ecfb';
    preview.textContent = String(content || '');
  }

  function describeWiegandSelection(){
    ensureWiegandDoorDefaults();
    const opt = getSelectedWiegandOption();
    const payload = getSelectedWiegandPayload();
    if(!opt || !payload){
      setWiegandPreview('Alege formatul și introdu bits/hex/int.', false);
      return;
    }
    const lines = [
      `Format: ${opt.textContent || ''}`,
      `Biți: ${payload.bit_length || payload.wiegand_count || '-'}`,
      `Mode: ${payload.wiegand_mode || payload.mode || '-'}`,
    ];
    if(payload.before_fmt || payload.after_fmt){
      lines.push(`Pattern: ${payload.before_fmt || ''}${payload.after_fmt ? ' / ' + payload.after_fmt : ''}`);
    } else {
      lines.push(`CID: ${payload.cid_start || 0}+${payload.cid_count || 0}`);
      lines.push(`Facility: ${payload.facility_code_start || 0}+${payload.facility_code_count || 0}`);
      lines.push(`Parity even/odd: ${payload.even_parity_start || 0}+${payload.even_parity_count || 0} / ${payload.odd_parity_start || 0}+${payload.odd_parity_count || 0}`);
    }
    setWiegandPreview(lines.join('\n'), false);
  }

  function buildWiegandManualPayload(options){
    const form = getWiegandManualForm();
    if(!form) return null;
    const fd = new FormData(form);
    const payload = {
      source: String(fd.get('source') || 'manual-wiegand').trim() || 'manual-wiegand',
      wiegand_bits: String(fd.get('wiegand_bits') || '').trim(),
      wiegand_hex: String(fd.get('wiegand_hex') || '').trim(),
      wiegand_int: String(fd.get('wiegand_int') || '').trim(),
      wiegand_format_id: String(fd.get('wiegand_format_id') || '').trim(),
    };
    const selectedPayload = getSelectedWiegandPayload();
    if(selectedPayload){
      payload.wiegand_format_config = selectedPayload;
      payload.wiegand_format = selectedPayload.format_name || selectedPayload.wiegand_name || null;
      payload.wiegand_bit_length = selectedPayload.bit_length || selectedPayload.wiegand_count || null;
    }
    const selectedDoor = (options && options.selectedDoor) ? options.selectedDoor : getSelectedWiegandDoor(Boolean(options && options.preferTestModal));
    if(selectedDoor && selectedDoor.id){
      payload.door_pk = selectedDoor.id;
      if(selectedDoor.deviceId){ payload.device_id = selectedDoor.deviceId; }
      if(selectedDoor.doorNumber){ payload.door_id = selectedDoor.doorNumber; }
      payload.verify_access = 1;
    } else if(options && options.verifyAccess === false){
      payload.verify_access = 0;
    }
    return payload;
  }

  let wiegandTestRunning = false;
  let wiegandTestTimer = null;
  let wiegandTestPending = false;

  function setWiegandTestStatus(message, isError){
    const el = getWiegandTestStatusEl();
    if(!el) return;
    el.style.color = isError ? '#ffbdbd' : '#b7d6eb';
    el.textContent = String(message || '');
  }

  function setWiegandTestButtons(){
    const startBtn = getWiegandTestStartBtn();
    const stopBtn = getWiegandTestStopBtn();
    if(startBtn) startBtn.disabled = wiegandTestRunning;
    if(stopBtn) stopBtn.disabled = !wiegandTestRunning;
  }

  function clearWiegandTestRows(){
    const body = getWiegandTestBody();
    if(!body) return;
    body.innerHTML = '<tr><td colspan="8" class="td-center-muted">Nu există încă evenimente de test.</td></tr>';
  }

  function renderWiegandEmployeeLabel(evalData){
    if(!evalData || typeof evalData !== 'object') return '-';
    const pin = String(evalData.employee_pin || '').trim();
    const name = String(evalData.employee_name || '').trim();
    if(pin && name) return `${pin} (${name})`;
    if(name) return name;
    if(pin) return pin;
    return '-';
  }

  function formatWiegandEventPoint(data, fallbackDoor){
    const evalData = data && data.access_eval && typeof data.access_eval === 'object' ? data.access_eval : null;
    if(evalData && evalData.door_name) return String(evalData.door_name);
    if(data && data.door_name) return String(data.door_name);
    if(fallbackDoor && fallbackDoor.doorName) return String(fallbackDoor.doorName);
    const dn = data && data.door_number ? String(data.door_number) : (fallbackDoor && fallbackDoor.doorNumber ? String(fallbackDoor.doorNumber) : '');
    return dn ? `Door ${dn}` : '-';
  }

  function formatWiegandDeviceLabel(data, fallbackDoor){
    const evalData = data && data.access_eval && typeof data.access_eval === 'object' ? data.access_eval : null;
    if(evalData && evalData.device_name) return String(evalData.device_name);
    if(data && data.device_name) return String(data.device_name);
    if(fallbackDoor && fallbackDoor.deviceName) return String(fallbackDoor.deviceName);
    if(data && data.device_id) return `#${data.device_id}`;
    return '-';
  }

  function appendWiegandTestRow(data, fallbackDoor){
    const body = getWiegandTestBody();
    if(!body) return;
    const evalData = data && data.access_eval && typeof data.access_eval === 'object' ? data.access_eval : null;
    const eventDescription = (evalData && evalData.event_description) ? evalData.event_description : ((data && data.source) ? `Wiegand ${data.source}` : 'Card read');
    const statusText = (evalData && evalData.status_text) ? evalData.status_text : 'CAPTURAT';
    const verifyMode = (evalData && evalData.verify_mode) ? evalData.verify_mode : ((data && data.source) ? data.source : '-');
    const rowHtml = `
      <tr>
        <td>${escapeHtml(new Date().toLocaleString())}</td>
        <td>${escapeHtml(formatWiegandDeviceLabel(data, fallbackDoor))}</td>
        <td>${escapeHtml(formatWiegandEventPoint(data, fallbackDoor))}</td>
        <td>${escapeHtml(eventDescription)}</td>
        <td>${escapeHtml((data && data.card_number) ? data.card_number : '-')}</td>

  async function pollWiegandTestLoop(){
    if(!wiegandTestRunning || wiegandTestPending) return;
    wiegandTestPending = true;
    const selectedDoor = getSelectedWiegandDoor(true);
    try{
      const resp = await fetch('/agent/api/cards/read/wait/', {headers:{'Accept':'application/json','X-Requested-With':'XMLHttpRequest'}});
      const data = await resp.json();
      if(resp.ok && data && data.ok === true){
        appendWiegandTestRow(data, selectedDoor);
        setWiegandTestStatus(`Ultimul card capturat: ${data.card_number || '-'} pe ${formatWiegandEventPoint(data, selectedDoor)}.`, false);
      } else if(resp.status !== 408) {
        throw new Error((data && (data.error || data.message)) ? (data.error || data.message) : `HTTP ${resp.status}`);
      }
    }catch(err){
      if(wiegandTestRunning){
        setWiegandTestStatus((err && err.message) ? err.message : String(err), true);
      }
    }finally{
      wiegandTestPending = false;

      lines.push(`Facility: ${decoded.facility_code != null ? decoded.facility_code : '-'}`);
      lines.push(`Site: ${decoded.site_code != null ? decoded.site_code : '-'}`);
      lines.push(`Manufacturer: ${decoded.manufacturer_code != null ? decoded.manufacturer_code : '-'}`);
      lines.push(`CID: ${decoded.card_id != null ? decoded.card_id : '-'}`);
      lines.push(`Parity valid: ${decoded.parity_valid == null ? '-' : (decoded.parity_valid ? 'da' : 'nu')}`);

      lines.push(`Hex: ${decoded.hex_value || '-'}`);

  function initializeWiegandFormatForm(scope){
    const form = scope ? scope.querySelector('form[data-wiegand-format-form="1"]') : null;
    if(!form || form.getAttribute('data-wiegand-init') === '1') return;
    form.setAttribute('data-wiegand-init', '1');

    const presetJsonEl = scope.querySelector('[data-wiegand-presets-json]');
    const presetRows = parseJsonText(presetJsonEl ? presetJsonEl.value : '', []);
    const presetSelect = form.querySelector('[data-wiegand-preset-select="1"]');
    const modeHidden = form.querySelector('input[name="wiegand_mode"]');
    const modeSwitches = Array.from(form.querySelectorAll('[data-wiegand-mode-switch="1"] input[type="radio"]'));
    const modeOnePanel = form.querySelector('[data-wiegand-mode-panel="1"]');
    const modeTwoPanel = form.querySelector('[data-wiegand-mode-panel="2"]');

    function setMode(mode){
      const nextMode = String(mode || '1') === '2' ? '2' : '1';
      if(modeHidden) modeHidden.value = nextMode;
      modeSwitches.forEach(r => { r.checked = (String(r.value || '') === nextMode); });
      if(modeOnePanel) modeOnePanel.style.display = (nextMode === '1') ? 'block' : 'none';
      if(modeTwoPanel) modeTwoPanel.style.display = (nextMode === '2') ? 'block' : 'none';
    }

    function fillField(name, value){
      const field = form.querySelector(`[name="${name}"]`);
      if(!field) return;
      if(field.type === 'checkbox'){
        field.checked = Boolean(value);
        return;
      }
      field.value = (value == null) ? '' : String(value);
    }

    function applyPreset(name){
      const preset = Array.isArray(presetRows) ? presetRows.find(row => String((row && (row.format_name || row.wiegand_name || row.name)) || '') === String(name || '')) : null;
      if(!preset) return;
      fillField('wiegand_name', preset.format_name || preset.wiegand_name || preset.name || '');
      fillField('wiegand_count', preset.bit_length || preset.wiegand_count || '');
      fillField('default_fmt', Boolean(preset.default_fmt));
      fillField('is_active', Boolean(preset.is_active));
      fillField('first_p', preset.first_p);
      fillField('second_p', preset.second_p);
      fillField('even_parity_start', preset.even_parity_start);
      fillField('even_parity_count', preset.even_parity_count);
      fillField('odd_parity_start', preset.odd_parity_start);
      fillField('odd_parity_count', preset.odd_parity_count);
      fillField('cid_start', preset.cid_start);
      fillField('cid_count', preset.cid_count);
      fillField('facility_code_start', preset.facility_code_start);
      fillField('facility_code_count', preset.facility_code_count);
      fillField('site_code_start', preset.site_code_start);
      fillField('site_code_count', preset.site_code_count);
      fillField('manufactory_code_start', preset.manufacturer_code_start || preset.manufactory_code_start);
      fillField('manufactory_code_count', preset.manufacturer_code_count || preset.manufactory_code_count);
      fillField('before_fmt', preset.before_fmt || '');
      fillField('after_fmt', preset.after_fmt || '');
      setMode(preset.wiegand_mode || preset.mode || 1);
    }

    modeSwitches.forEach(r => r.addEventListener('change', ()=> setMode(r.value)));
    if(presetSelect){
      presetSelect.addEventListener('change', ()=>{
        const value = String(presetSelect.value || '').trim();
        if(value) applyPreset(value);
      });
    }
    setMode(modeHidden ? modeHidden.value : (modeSwitches.find(r => r.checked) || {}).value || '1');
    if(presetSelect && String(presetSelect.value || '').trim()){
      const shouldHydrate = !String((form.querySelector('[name="wiegand_name"]') || {}).value || '').trim();
      if(shouldHydrate){
        applyPreset(presetSelect.value);
      }
    }
  }

  async function syncDeviceAccessLevelsFromAccessModule(deviceId, deviceName){
    const devId = parseInt(String(deviceId||0), 10) || 0;
    const devName = String(deviceName || ('#' + String(devId)));
    if(!(devId > 0)) return;

    _stopAccessSyncPoll();

    const endpoint = `/agent/api/devices/${encodeURIComponent(String(devId))}/sync/`;
    _actionModalOpen('SINCRONIZARE', 'Centrală');
    _actionModalSet('loading', 'SYNC', `Se pune în coadă sincronizarea către centrală (${devName})...`);

    let data = null;
    try{
      const resp = await fetch(endpoint, {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'X-Requested-With':'XMLHttpRequest',
          'X-CSRFToken': getCSRF(),
        },
        body: '{}'
      });
      try{ data = await resp.json(); }catch(_e){ data = null; }
      if(!resp.ok || !data || data.ok !== true){
        const msg = (data && (data.error || data.message)) ? (data.error || data.message) : `HTTP ${resp.status}`;
        _actionModalSet('error', 'SYNC EȘUAT', String(msg || 'Eroare necunoscută.'));
        try{ window.setTimeout(()=>{ try{ window.zkActionModal.close(); }catch(_e){} }, 1800); }catch(_e){}
        return;
      }
    }catch(err){
      _actionModalSet('error', 'SYNC EȘUAT', (err && err.message) ? err.message : String(err));
      try{ window.setTimeout(()=>{ try{ window.zkActionModal.close(); }catch(_e){} }, 1800); }catch(_e){}
      return;
    }

    const cmdId = parseInt(String(data.command_id || 0), 10) || 0;
    if(!(cmdId > 0)){
      _actionModalSet('error', 'SYNC EȘUAT', 'Nu am primit command_id de la server.');
      try{ window.setTimeout(()=>{ try{ window.zkActionModal.close(); }catch(_e){} }, 1800); }catch(_e){}
      return;
    }

    const startTs = Date.now();
    const statusUrl = `/agent/api/commands/${encodeURIComponent(String(cmdId))}/status/`;

    _actionModalSet('loading', 'SYNC ÎN COADĂ', `Comanda #${cmdId} (centrală ${devName})...`);

    async function pollOnce(){
      try{
        const r = await fetch(statusUrl, {headers:{'Accept':'application/json','X-Requested-With':'XMLHttpRequest'}});
        const j = await r.json();
        const status = String((j && (j.status || (j.item && j.item.status))) || '').toUpperCase();
        const result = String((j && (j.result || (j.item && j.item.result))) || '');
        if(status === 'OK'){
          _stopAccessSyncPoll();
          _actionModalSet('success', 'SYNC REALIZAT', `Centrală ${devName}. ${result || ''}`.trim());
          try{ window.setTimeout(()=>{ try{ window.zkActionModal.close(); }catch(_e){} }, 1200); }catch(_e){}
          return;
        }
        if(status === 'ERR'){
          _stopAccessSyncPoll();
          _actionModalSet('error', 'SYNC EȘUAT', `Centrală ${devName}. ${result || ''}`.trim());
          try{ window.setTimeout(()=>{ try{ window.zkActionModal.close(); }catch(_e){} }, 1800); }catch(_e){}
          return;
        }

        const elapsed = (Date.now() - startTs);
        if(elapsed > 120000){
          _stopAccessSyncPoll();
          _actionModalSet('success', 'SYNC ÎN CURS', `Comanda #${cmdId} încă rulează (centrală ${devName}). Verifică „Comenzi către centrale”.`);
          try{ window.setTimeout(()=>{ try{ window.zkActionModal.close(); }catch(_e){} }, 2400); }catch(_e){}
        }
      }catch(_e){
        // Keep polling on transient errors.
      }
    }

    try{ await pollOnce(); }catch(_e){}
    _accessSyncPollTimer = window.setInterval(pollOnce, 1000);
  }

    const margin = 6;
    const w = el.offsetWidth || 280;

    const vw = window.innerWidth || document.documentElement.clientWidth || 1024;
    const vh = window.innerHeight || document.documentElement.clientHeight || 768;
    if((left + w) > (vw - margin)) left = Math.max(margin, vw - w - margin);
    if(left < margin) left = margin;
    if((top + h) > (vh - margin)) top = Math.max(margin, r.top - h - margin);

  function isSavedContent(){
    return Boolean(modalBody.querySelector('[data-access-saved="1"], [data-segment-saved="1"]'));
  }

  function wireModalBody(){
    modalBody.querySelectorAll('[data-modal-close="1"]').forEach(btn => btn.addEventListener('click', closeModal));

    // In-modal content reload (used by Get events / data-heavy modals)
    modalBody.querySelectorAll('[data-modal-reload-url]').forEach(btn => {
      btn.addEventListener('click', (e)=>{
        try{ e.preventDefault(); }catch(_e){}
        const url = String(btn.getAttribute('data-modal-reload-url') || '').trim();
        if(!url) return;
        const title = String(btn.getAttribute('data-modal-title') || '').trim();
        openAccessModal(url, title || modalTitle.textContent || 'Formular');
      });
    });

    const form = modalBody.querySelector('form[data-modal-form="1"]');
    if(form){
      form.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const url = currentModalUrl || window.location.href;

        const hasActionModal = window.zkActionModal && typeof window.zkActionModal.open === 'function' && typeof window.zkActionModal.setState === 'function';
        if(hasActionModal){
          try{
            const modalTitle = String(form.getAttribute('data-action-modal-title') || 'UPDATE');
            const modalSubtitle = String(form.getAttribute('data-action-modal-subtitle') || 'Salvare date');
            const loadingBig = String(form.getAttribute('data-action-loading-big') || 'UPDATE ÎN CURS');
            const loadingMsg = String(form.getAttribute('data-action-loading-msg') || 'Se salvează datele...');
            window.zkActionModal.open({mode:'', module:'', title: modalTitle, subtitle: modalSubtitle});
            window.zkActionModal.setState('loading', loadingBig, loadingMsg);
          }catch(_e){}
        }

        const resp = await fetch(url, {
          method: 'POST',
          headers: {'X-Requested-With':'XMLHttpRequest','X-CSRFToken': getCSRF()},
          body: new FormData(form)
        });
        const html = await resp.text();
        modalBody.innerHTML = html;
        wireModalBody();
        if(isSavedContent()){
          const savedEl = modalBody.querySelector('[data-access-saved="1"], [data-segment-saved="1"]');
          let closeDelayMs = 250;
          let actionState = 'success';
          let actionTitle = 'UPDATE REALIZAT CU SUCCES';
          let actionMsg = 'Datele au fost salvate.';
          try{
            if(savedEl){
              closeDelayMs = parseInt(savedEl.getAttribute('data-close-delay-ms') || '250', 10) || 250;
              actionState = savedEl.getAttribute('data-action-state') || actionState;
              actionTitle = savedEl.getAttribute('data-action-title') || actionTitle;
              actionMsg = savedEl.getAttribute('data-action-message') || actionMsg;
            }
          }catch(_e){}

          window.setTimeout(async ()=>{
            try{ await loadTab(currentTab, currentTabUrl); }catch(e){}
            closeModal();

            if(hasActionModal){
              try{
                window.zkActionModal.setState(actionState, actionTitle, actionMsg);
                window.setTimeout(()=>{ try{ window.zkActionModal.close(); }catch(_e){} }, 1200);
              }catch(_e){}
            }
          }, closeDelayMs);
        } else {
          if(hasActionModal){
            try{
              window.zkActionModal.setState('error', 'UPDATE NEREUȘIT', 'Verifică câmpurile din formular.');
              window.setTimeout(()=>{ try{ window.zkActionModal.close(); }catch(_e){} }, 1400);
            }catch(_e){}
          }
        }
      });
    }

    // Initialize lightweight widgets inside modal content. Note: scripts in injected
    // HTML are not executed (innerHTML), so any initialization must happen here.
    try{
      const doorForm = modalBody.querySelector('form[data-door-form="1"]');
      if(doorForm){
        const ip = (doorForm.getAttribute('data-device-ip') || '').trim();
        const doorNoEl = doorForm.querySelector('select[name="door_number"], input[name="door_number"]');
        const inEl = doorForm.querySelector('input[name="reader_in_custom_name"]');
        const outEl = doorForm.querySelector('input[name="reader_out_custom_name"]');
        const prevDoorNo = doorNoEl ? String(doorNoEl.value || '').trim() : '';
        function isDerived(val, dn){
          try{
            const v = String(val||'').trim();
            const d = String(dn||'').trim();
            if(!v || !ip || !d) return false;
            return v === `${ip}-${d} In` || v === `${ip}-${d} Out`;
          }catch(_e){ return false; }
        }
        function renderReaders(){
          const dn = doorNoEl ? String(doorNoEl.value || '').trim() : '';
          const derivedIn = (ip && dn) ? `${ip}-${dn} In` : '';
          const derivedOut = (ip && dn) ? `${ip}-${dn} Out` : '';
          const placeholderIn = ip ? (dn ? `${ip}-${dn} In` : `${ip}-<Nr> In`) : '';
          const placeholderOut = ip ? (dn ? `${ip}-${dn} Out` : `${ip}-<Nr> Out`) : '';

          // If user previously had auto-derived values (from old door number), refresh
          // them when door number changes. If user typed a real custom value, keep it.
          let oldDn = '';
          try{ oldDn = doorForm.getAttribute('data-prev-door-no') || ''; }catch(_e){}
          if(!oldDn){ oldDn = prevDoorNo; }
          const derivedInOld = (ip && oldDn) ? `${ip}-${oldDn} In` : '';
          const derivedOutOld = (ip && oldDn) ? `${ip}-${oldDn} Out` : '';

          if(inEl){
            try{ inEl.setAttribute('placeholder', placeholderIn || ''); }catch(_e){}
            const cur = String(inEl.value || '').trim();
            if((!cur && derivedIn) || (derivedInOld && cur === derivedInOld)){
              if(derivedIn) inEl.value = derivedIn;
            }
          }
          if(outEl){
            try{ outEl.setAttribute('placeholder', placeholderOut || ''); }catch(_e){}
            const cur = String(outEl.value || '').trim();
            if((!cur && derivedOut) || (derivedOutOld && cur === derivedOutOld)){
              if(derivedOut) outEl.value = derivedOut;
            }
          }

          try{ doorForm.setAttribute('data-prev-door-no', dn); }catch(_e){}
        }
        if(doorNoEl){ doorNoEl.addEventListener('change', renderReaders); doorNoEl.addEventListener('keyup', renderReaders); }
        renderReaders();
      }
    }catch(_e){}

    try{
      initializeWiegandFormatForm(modalBody);
    }catch(_e){}

    // Initialize device modal widgets (comm mode groups) - injected scripts don't run.
    try{
      const devScope = modalBody.querySelector('.device-form-scope');
      if(devScope){
        const tcp = devScope.querySelector('#tcp-group');
        const rs = devScope.querySelector('#rs485-group');
        function applyCommMode(){
          const modeEl = devScope.querySelector('input[name="comm_mode"]:checked');
          const mode = modeEl ? String(modeEl.value || 'tcp') : 'tcp';
          if(tcp) tcp.style.display = (mode === 'tcp') ? 'block' : 'none';
          if(rs) rs.style.display = (mode === 'rs485') ? 'block' : 'none';
        }
        devScope.querySelectorAll('input[name="comm_mode"]').forEach(r=>{
          r.addEventListener('change', applyCommMode);
        });
        applyCommMode();
      }
    }catch(_e){}

    // Initialize Access Level modal widgets: controller picker (table add/remove)
    try{
      const picker = modalBody.querySelector('[data-al-device-picker="1"]');
      const addBtn = modalBody.querySelector('[data-al-device-add="1"]');
      const tbody = modalBody.querySelector('[data-al-device-table-body="1"]');
      if(picker && addBtn && tbody){
        let sharedTimeWrap = tbody.querySelector('[data-al-shared-time="1"]');
        let sharedVisitorWrap = tbody.querySelector('[data-al-shared-visitor="1"]');

        function _detachShared(fromEl){
          try{
            if(fromEl){
              const t = fromEl.querySelector('[data-al-shared-time="1"]');
              const v = fromEl.querySelector('[data-al-shared-visitor="1"]');
              if(t){ sharedTimeWrap = t; }
              if(v){ sharedVisitorWrap = v; }
            }
          }catch(_e){}
        }

        function _deviceRows(){
          return Array.from(tbody.querySelectorAll('tr[data-al-device-row="1"][data-device-id]'));
        }

        function _syncSharedPlacement(){
          const rows = _deviceRows();
          const cnt = rows.length;

          if(cnt <= 0){
            // Ensure empty row exists and holds shared widgets.
            if(!tbody.querySelector('[data-al-device-empty="1"]')){
              const tr = document.createElement('tr');
              tr.setAttribute('data-al-device-empty', '1');
              tr.innerHTML = `
                <td colspan="2" class="td-center-muted">Nu ai selectat nicio centrală.</td>
                <td style="white-space:normal;"></td>
                <td style="white-space:normal;"></td>
                <td class="td-center-muted">—</td>
              `;
              // Attach shared widgets (move them into this row)
              const tCell = tr.children && tr.children[1] ? tr.children[1] : null;
              const vCell = tr.children && tr.children[2] ? tr.children[2] : null;
              if(tCell && sharedTimeWrap) tCell.appendChild(sharedTimeWrap);
              if(vCell && sharedVisitorWrap) vCell.appendChild(sharedVisitorWrap);
              tbody.appendChild(tr);
            }
            return;
          }

          // Remove any empty placeholder.
          const empty = tbody.querySelector('[data-al-device-empty="1"]');
          if(empty){
            _detachShared(empty);
            empty.remove();
          }

          const first = rows[0];
          let timeTd = first.querySelector('td[data-al-time-td="1"]');
          let visitorTd = first.querySelector('td[data-al-visitor-td="1"]');

          // If first row doesn't have shared columns (added via JS), insert them.
          if(!timeTd || !visitorTd){
            // Insert before actions cell (last)
            const t = document.createElement('td');
            t.setAttribute('data-al-time-td', '1');
            t.style.whiteSpace = 'normal';
            const v = document.createElement('td');
            v.setAttribute('data-al-visitor-td', '1');
            v.style.whiteSpace = 'normal';
            const actionCell = first.lastElementChild;
            if(actionCell){
              first.insertBefore(t, actionCell);
              first.insertBefore(v, actionCell);
            } else {
              first.appendChild(t);
              first.appendChild(v);
            }
            timeTd = t;
            visitorTd = v;
          }

          try{ timeTd.setAttribute('rowspan', String(cnt)); }catch(_e){}
          try{ visitorTd.setAttribute('rowspan', String(cnt)); }catch(_e){}

          // Ensure shared widgets are inside these cells.
          if(sharedTimeWrap && timeTd && !timeTd.contains(sharedTimeWrap)) timeTd.appendChild(sharedTimeWrap);
          if(sharedVisitorWrap && visitorTd && !visitorTd.contains(sharedVisitorWrap)) visitorTd.appendChild(sharedVisitorWrap);
        }

        function _selIds(){
          return Array.from(tbody.querySelectorAll('tr[data-al-device-row="1"][data-device-id]'))
            .map(tr => String(tr.getAttribute('data-device-id') || '').trim())
            .filter(Boolean);
        }
        function _ensureEmpty(){
          if(_deviceRows().length > 0) return;
          _syncSharedPlacement();
        }
        function _addOption(id, name){
          if(!id) return;
          const exists = Array.from(picker.options || []).some(o => String(o.value||'') === String(id));
          if(exists) return;
          const opt = document.createElement('option');
          opt.value = String(id);
          opt.textContent = String(name || ('#'+id));
          try{ opt.setAttribute('data-device-name', String(name||'')); }catch(_e){}
          picker.appendChild(opt);
        }
        function _removeOption(id){
          if(!id) return;
          const opt = picker.querySelector('option[value="' + String(id).replace(/"/g,'') + '"]');
          if(opt) opt.remove();
          try{ picker.value = ''; }catch(_e){}
        }
        function _addRow(id, name){
          const rows = _deviceRows();

          // If we are transitioning from empty -> first device, preserve shared widgets.
          const empty = tbody.querySelector('[data-al-device-empty="1"]');
          if(empty){
            _detachShared(empty);
            empty.remove();
          }

          const tr = document.createElement('tr');
          tr.setAttribute('data-al-device-row', '1');
          tr.setAttribute('data-device-id', String(id));
          tr.setAttribute('data-device-name', String(name||''));

          if(rows.length === 0){
            tr.innerHTML = `
              <td><span class="al-pill">#${_h(id)}</span></td>
              <td><strong>${_h(name || ('#'+id))}</strong></td>
              <td data-al-time-td="1" style="white-space:normal;"></td>
              <td data-al-visitor-td="1" style="white-space:normal;"></td>
              <td>
                <input type="hidden" name="devices" value="${_h(id)}" data-al-device-input="1" />
                <button type="button" class="btn-danger btn-small" data-al-device-remove="1">Șterge</button>
              </td>
            `;
          } else {
            tr.innerHTML = `
              <td><span class="al-pill">#${_h(id)}</span></td>
              <td><strong>${_h(name || ('#'+id))}</strong></td>
              <td>
                <input type="hidden" name="devices" value="${_h(id)}" data-al-device-input="1" />
                <button type="button" class="btn-danger btn-small" data-al-device-remove="1">Șterge</button>
              </td>
            `;
          }

          tbody.appendChild(tr);
          _syncSharedPlacement();
        }

        addBtn.addEventListener('click', (e)=>{
          try{ e.preventDefault(); }catch(_e){}
          const id = String(picker.value || '').trim();
          if(!id) return;
          const already = _selIds().includes(id);
          if(already) return;
          const opt = picker.querySelector('option[value="' + id.replace(/"/g,'') + '"]');
          const name = opt ? String(opt.textContent || '').trim() : ('#'+id);
          _addRow(id, name);
          _removeOption(id);
        });

        tbody.addEventListener('click', (e)=>{
          const rm = e.target && e.target.closest ? e.target.closest('[data-al-device-remove="1"]') : null;
          if(!rm) return;
          try{ e.preventDefault(); }catch(_e){}
          const tr = rm.closest('tr[data-al-device-row="1"]');
          if(!tr) return;

          // Preserve shared widgets if we are removing the row that contains them.
          _detachShared(tr);

          const id = String(tr.getAttribute('data-device-id') || '').trim();
          const name = String(tr.getAttribute('data-device-name') || '').trim();
          tr.remove();
          _addOption(id, name);

          _syncSharedPlacement();
          _ensureEmpty();
        });

        // Normalize initial state after server render.
        _syncSharedPlacement();
        _ensureEmpty();
      }
    }catch(_e){}
  }

        const data = await resp.json();
        if(data && data.ok && Array.isArray(data.responsive) && data.responsive.length){
          let html = `<div style="color:#9fd2f1;font-weight:900;">✓ Găsite ${data.count} dispozitive</div>`;
          html += `<div class="hint">Metoda: ${data.method || '-'} | Scannate: ${data.scanned || '-'} | ${data.elapsed_seconds || '-'}s</div><div style="margin-top:6px;">`;
          data.responsive.forEach(ip=>{ html += `<span class="ip" data-mini-pick-ip="${ip}">${ip}</span>`; });
          html += '</div>';
          showResults(html);
        } else {
          showResults('<div class="hint" style="color:#ffbdbd;">❌ Nicio adresă receptivă găsită.</div>');
        }
      }catch(err){
        showResults(`<div class="hint" style="color:#ffbdbd;">❌ Eroare: ${(err && err.message) ? err.message : String(err)}</div>`);
      }
    }

    async function doPing(){
      const ip = String(wrap.querySelector('#admPingIp')?.value || '').trim();
      if(!ip){ showResults('<div class="hint" style="color:#ffbdbd;">Introdu o adresă IP.</div>'); return; }
      showResults('<div class="hint">⏳ Ping...</div>');
      try{
        const resp = await fetch(`/agent/devices/ping/?ip=${encodeURIComponent(ip)}`);
        const data = await resp.json();
        if(data && data.ok && data.alive){
          showResults(`<div style="color:#2da44e;font-weight:900;">🟢 ${ip} ONLINE</div><div style="margin-top:6px;"><span class="ip" data-mini-pick-ip="${ip}">Folosește ${ip}</span></div>`);
        } else if(data && data.ok){
          showResults(`<div class="hint" style="color:#ffbdbd;">🔴 ${ip} NU răspunde la ping</div>`);
        } else {
          showResults(`<div class="hint" style="color:#ffbdbd;">❌ Eroare ping: ${(data && data.error) ? data.error : 'unknown'}</div>`);
        }
      }catch(err){
        showResults(`<div class="hint" style="color:#ffbdbd;">❌ Eroare: ${(err && err.message) ? err.message : String(err)}</div>`);
      }
    }

    async function doPort(){
      const ip = String(wrap.querySelector('#admPortIp')?.value || '').trim();
      const port = String(wrap.querySelector('#admPort')?.value || '4370').trim();
      if(!ip){ showResults('<div class="hint" style="color:#ffbdbd;">Introdu IP pentru test port.</div>'); return; }
      showResults(`<div class="hint">⏳ Test port ${port}...</div>`);
      try{
        const resp = await fetch(`/agent/devices/port-test/?ip=${encodeURIComponent(ip)}&port=${encodeURIComponent(port)}`);
        const data = await resp.json();
        if(data && data.ok && data.open){
          showResults(`<div style="color:#2da44e;font-weight:900;">✓ Port ${data.port} DESCHIS pe ${data.ip}</div><div class="hint">Poți folosi această adresă pentru centrală.</div><div style="margin-top:6px;"><span class="ip" data-mini-pick-ip="${ip}" data-mini-pick-port="${data.port}">Folosește ${ip}:${data.port}</span></div>`);
        } else if(data && data.ok){
          showResults(`<div class="hint" style="color:#ffbdbd;">✗ Port ${data.port} ÎNCHIS/FILTRAT pe ${data.ip}</div>`);
        } else {
          showResults(`<div class="hint" style="color:#ffbdbd;">❌ Eroare: ${(data && data.error) ? data.error : 'unknown'}</div>`);
        }
      }catch(err){
        showResults(`<div class="hint" style="color:#ffbdbd;">❌ Eroare: ${(err && err.message) ? err.message : String(err)}</div>`);
      }
    }

    wrap.addEventListener('click', (ev)=>{
      const c = ev.target && ev.target.closest ? ev.target.closest('[data-mini-close="1"], [data-mini-scan="1"], [data-mini-ping="1"], [data-mini-port="1"], [data-mini-pick-ip]') : null;
      if(!c) return;
      if(c.hasAttribute('data-mini-close')){ closeAccessDiscoveryMini(); return; }
      if(c.hasAttribute('data-mini-scan')){ doScan(); return; }
      if(c.hasAttribute('data-mini-ping')){ doPing(); return; }
      if(c.hasAttribute('data-mini-port')){ doPort(); return; }
      if(c.hasAttribute('data-mini-pick-ip')){
        const ip = c.getAttribute('data-mini-pick-ip');
        const p = c.getAttribute('data-mini-pick-port');
        selectAddress(ip, p);
        return;
      }
    });

    _accessDiscoveryMini = {
      el: wrap,
      showResults,
    };
    return _accessDiscoveryMini;
  }

  function openAccessDiscoveryMini(){
    const ui = _ensureAccessDiscoveryMini();
    // Seed prefix/ip from current device modal, if present
    try{
      const ipEl = modalBody ? modalBody.querySelector('input[name="ip_address"]') : null;
      const currentIp = ipEl ? String(ipEl.value || '').trim() : '';
      const baseEl = ui.el.querySelector('#admNetBase');
      const pingEl = ui.el.querySelector('#admPingIp');
      const portIpEl = ui.el.querySelector('#admPortIp');
      if(currentIp){
        if(pingEl && !pingEl.value) pingEl.value = currentIp;
        if(portIpEl && !portIpEl.value) portIpEl.value = currentIp;
        const parts = currentIp.split('.');
        if(parts.length === 4 && baseEl && !baseEl.value){
          baseEl.value = `${parts[0]}.${parts[1]}.${parts[2]}`;
        }
      } else {
        if(baseEl && !baseEl.value) baseEl.value = '192.168.1';
      }
      ui.showResults('', false);
    }catch(_e){}
    ui.el.style.display = 'flex';
  }

  function closeAccessDiscoveryMini(){
    const ui = _ensureAccessDiscoveryMini();
    ui.el.style.display = 'none';
  }

  async function doDelete(url, message){
    const ok = window.zkConfirmDialog ? await zkConfirmDialog({
      title:'Confirmare',
      message: message || 'Ștergi înregistrarea?',
      okText:'Șterge',
      cancelText:'Renunță',
      variant:'danger'
    }) : confirm(message || 'Delete?');

    if(!ok) return;

    const hasActionModal = window.zkActionModal && typeof window.zkActionModal.open === 'function' && typeof window.zkActionModal.setState === 'function';
    if(hasActionModal){
      try{
        window.zkActionModal.open({mode:'', module:'', title:'ȘTERGERE', subtitle:'Operațiune'});
        window.zkActionModal.setState('loading', 'ȘTERGERE ÎN CURS', 'Se șterge înregistrarea...');
      }catch(_e){}
    }

    try{
      const resp = await fetch(url, {method:'POST', headers:{'X-CSRFToken': getCSRF()}});
      const data = await resp.json().catch(()=>null);
      if(data && data.ok){
        await loadTab(currentTab, currentTabUrl);
        if(hasActionModal){
          try{
            window.zkActionModal.setState('success', 'ȘTERS CU SUCCES', 'Înregistrarea a fost ștearsă.');
            window.setTimeout(()=>{ try{ window.zkActionModal.close(); }catch(_e){} }, 1000);
          }catch(_e){}
        }
        return;
      }
      const errMsg = (data && data.error) ? String(data.error) : 'Delete failed';
      if(hasActionModal){
        try{
          window.zkActionModal.setState('error', 'ȘTERGERE NEREUȘITĂ', errMsg);
        }catch(_e){}
      } else {
        alert(errMsg);
      }
    }catch(err){
      const msg = (err && err.message) ? err.message : String(err);
      if(hasActionModal){
        try{ window.zkActionModal.setState('error', 'ȘTERGERE NEREUȘITĂ', msg); }catch(_e){}
      } else {
        alert(msg);
      }
    }
  }

    // Niveluri: expand/collapse controller -> doors inside the level detail subtable
    const lvlDevTgl = e.target && e.target.closest ? e.target.closest('[data-level-device-toggle="1"]') : null;

    // Door auto-assign mapping (repairs imported/legacy doors)
    const autoAssign = e.target && e.target.closest ? e.target.closest('[data-auto-assign="1"]') : null;
    if(autoAssign){
      const id = autoAssign.getAttribute('data-device-id');
      if(!id) return;

      if(hasActionModal){
        try{ window.zkActionModal.open({mode:'', module:'door', title:'DOOR CONFIGURATION', subtitle:'Auto-map'}); window.zkActionModal.setState('loading', 'IN PROGRESS', 'Auto-mapping doors...'); }catch(_e){}
      }
      fetch('/agent/api/devices/' + encodeURIComponent(String(id)) + '/doors/auto-assign/', {
        method:'POST',
        headers:{'X-CSRFToken': getCSRF()}
      })
      .then(r=>r.json())
      .then(d=>{
        if(d && d.ok){
          if(hasActionModal){
            try{ window.zkActionModal.setState('success', 'OK', 'Doors mapped.'); setTimeout(()=>{ try{ window.zkActionModal.close(); }catch(_e){} }, 900);}catch(_e){}

        } else {
          const msg = (d && d.error) ? String(d.error) : 'Error';
          if(hasActionModal){ try{ window.zkActionModal.setState('error', 'FAILED', msg); }catch(_e){} }
          else { alert(msg); }

      })
      .catch(err=>{
        const msg = err && err.message ? err.message : String(err);
        if(hasActionModal){ try{ window.zkActionModal.setState('error', 'FAILED', msg); }catch(_e){} }
        else { alert(msg); }
      });
      return;
    }

    // Doors tab actions (OPEN/CLOSE buttons)
    const doorAct = e.target && e.target.closest ? e.target.closest('[data-door-action]') : null;
    if(doorAct){
      const kind = doorAct.getAttribute('data-door-action');
      const pk = doorAct.getAttribute('data-door-pk');
      if(!pk) return;
      let url = null;
      if(kind === 'open') url = '/agent/api/doors/' + encodeURIComponent(pk) + '/open/';
      if(kind === 'close') url = '/agent/api/doors/' + encodeURIComponent(pk) + '/close/';
      if(!url) return;
      const hasActionModal = window.zkActionModal && typeof window.zkActionModal.open === 'function' && typeof window.zkActionModal.setState === 'function';
      if(hasActionModal){
        try{ window.zkActionModal.open({mode:'', module:'', title:'UȘĂ', subtitle:'Comandă'}); window.zkActionModal.setState('loading', 'COMANDĂ ÎN CURS', kind.toUpperCase()); }catch(_e){}
      }
      fetch(url, {method:'POST', headers:{'X-CSRFToken': getCSRF()}})
        .then(r=>r.json())
        .then(d=>{
          if(d && d.ok){
            if(hasActionModal){
              try{ window.zkActionModal.setState('success', 'OK', 'Comanda a fost trimisă.'); setTimeout(()=>{ try{ window.zkActionModal.close(); }catch(_e){} }, 900);}catch(_e){}
            }
          } else {
            const msg = (d && d.error) ? String(d.error) : 'Eroare';
            if(hasActionModal){ try{ window.zkActionModal.setState('error', 'EȘEC', msg); }catch(_e){} }
            else { alert(msg); }
          }
        })
        .catch(err=>{
          const msg = err && err.message ? err.message : String(err);
          if(hasActionModal){ try{ window.zkActionModal.setState('error', 'EȘEC', msg); }catch(_e){} }
          else { alert(msg); }
        });
      return;
    }

    const tabBtn = e.target && e.target.closest ? e.target.closest('.access-tab-btn[data-tab]') : null;
    if(tabBtn){
      const tab = tabBtn.getAttribute('data-tab');
      loadTab(tab);
      return;
    }

    // Door Configuration Search/Clear must build the URL from inputs
    const dcSearch = e.target && e.target.closest ? e.target.closest('#dcSearchLink') : null;
    if(dcSearch){
      e.preventDefault();
      const dev = (document.getElementById('dcDeviceName')||{}).value || '';
      const door = (document.getElementById('dcDoorName')||{}).value || '';
      const params = new URLSearchParams();
      params.set('embed','1');
      params.set('mode','config');
      if(dev.trim()) params.set('device_name', dev.trim());
      if(door.trim()) params.set('door_name', door.trim());
      const href = '/agent/crud/doors/?' + params.toString();
      loadTab(currentTab, href);
      return;
    }
    const dcClear = e.target && e.target.closest ? e.target.closest('#dcClearLink') : null;
    if(dcClear){
      e.preventDefault();
      try{
        const d1 = document.getElementById('dcDeviceName');
        const d2 = document.getElementById('dcDoorName');
        if(d1) d1.value='';
        if(d2) d2.value='';
      }catch(_e){}
      loadTab(currentTab, '/agent/crud/doors/?embed=1&mode=config');
      return;
    }

    // Nivel Acces personal: filter levels list
    const palFilterBtn = e.target && e.target.closest ? e.target.closest('[data-pal-filter="1"]') : null;
    if(palFilterBtn){
      try{ e.preventDefault(); }catch(_e){}
      const q = String((document.getElementById('palLevelFilter')||{}).value || '').trim();
      try{
        const base = new URL(String(currentTabUrl || TAB_META.personal_levels.url), window.location.origin);
        base.searchParams.set('embed','1');
        if(q){ base.searchParams.set('q', q); } else { base.searchParams.delete('q'); }
        base.searchParams.delete('page');
        base.searchParams.delete('level_id');
        loadTab(currentTab, base.pathname + base.search);
      }catch(_e){
        loadTab(currentTab, TAB_META.personal_levels.url + (q ? ('&q=' + encodeURIComponent(q)) : ''));
      }
      return;
    }

    // Nivel Acces personal: select-all toggle
    if(e && e.target && e.target.id === 'palSelAll'){
      try{
        const on = Boolean(e.target.checked);
        document.querySelectorAll('#palAssignedTable input[name="pal_emp"]').forEach(ch => { try{ ch.checked = on; }catch(_e){} });
      }catch(_e){}
      return;
    }

    // Nivel Acces personal: employee search
    const palEmpSearchBtn = e.target && e.target.closest ? e.target.closest('[data-pal-emp-search="1"]') : null;
    if(palEmpSearchBtn){
      try{ e.preventDefault(); }catch(_e){}
      const msg = document.getElementById('palMsg');
      const q = String((document.getElementById('palEmpSearch')||{}).value || '').trim();
      const sel = document.getElementById('palEmpResults');
      if(msg) msg.textContent = 'Se caută...';

      try{ hideMoreMenu(); }catch(_e){}

      showLevelInfoMenu(lvlMore, html);
      return;

      try{ hideLevelInfoMenu(); }catch(_e){}
      const id = devMore.getAttribute('data-device-id');
      const name = devMore.getAttribute('data-device-name') || '';
      if(id) showMoreMenu(devMore, id, name);
      return;
    }

    // Click outside menu closes it.
    const insideMenu = (e.target && e.target.closest) ? e.target.closest('[data-more-menu="1"], [data-level-menu="1"]') : null;
    if(!insideMenu){
      hideMoreMenu();
      hideLevelInfoMenu();
    }

    const delBtn = e.target && e.target.closest ? e.target.closest('[data-access-del="1"]') : null;
    if(delBtn){
      const url = delBtn.getAttribute('data-url');
      const msg = delBtn.getAttribute('data-confirm') || 'Ștergi înregistrarea?';
      if(url) doDelete(url, msg);
      return;
    }

    const wgDecodeBtn = e.target && e.target.closest ? e.target.closest('[data-wiegand-decode="1"]') : null;
    if(wgDecodeBtn){
      try{ e.preventDefault(); }catch(_e){}
      decodeWiegandManual();
      return;
    }

    const wgSendBtn = e.target && e.target.closest ? e.target.closest('[data-wiegand-send="1"]') : null;
    if(wgSendBtn){
      try{ e.preventDefault(); }catch(_e){}
      sendWiegandManual();
      return;
    }

    const wgUseBtn = e.target && e.target.closest ? e.target.closest('[data-wiegand-use="1"]') : null;
    if(wgUseBtn){
      try{ e.preventDefault(); }catch(_e){}
      selectWiegandFormat(wgUseBtn.getAttribute('data-format-id'));
      return;
    }

    const wgActivateBtn = e.target && e.target.closest ? e.target.closest('[data-wiegand-activate="1"]') : null;
    if(wgActivateBtn){
      try{ e.preventDefault(); }catch(_e){}
      activateWiegandFormat(wgActivateBtn.getAttribute('data-url'));
      return;
    }

    const wgTestOpenBtn = e.target && e.target.closest ? e.target.closest('[data-wiegand-test-open="1"]') : null;
    if(wgTestOpenBtn){
      try{ e.preventDefault(); }catch(_e){}
      openWiegandTestModal();
      return;
    }

    const wgTestCloseBtn = e.target && e.target.closest ? e.target.closest('[data-wiegand-test-close="1"]') : null;
    if(wgTestCloseBtn){
      try{ e.preventDefault(); }catch(_e){}
      closeWiegandTestModal();
      return;
    }

    const wgTestStartBtn = e.target && e.target.closest ? e.target.closest('[data-wiegand-test-start="1"]') : null;
    if(wgTestStartBtn){
      try{ e.preventDefault(); }catch(_e){}
      startWiegandTest();
      return;
    }

    const wgTestStopBtn = e.target && e.target.closest ? e.target.closest('[data-wiegand-test-stop="1"]') : null;
    if(wgTestStopBtn){
      try{ e.preventDefault(); }catch(_e){}
      stopWiegandTest();
      return;
    }

    const pageLink = e.target && e.target.closest ? e.target.closest('[data-access-page="1"]') : null;
    if(pageLink){
      const href = pageLink.getAttribute('href');
      if(href){
        e.preventDefault();
        loadTab(currentTab, href);
      }
    }

    const uiBtn = e.target && e.target.closest ? e.target.closest('[data-access-ui]') : null;
    if(uiBtn){
      const kind = uiBtn.getAttribute('data-access-ui');
      if(kind === 'reload'){
        loadTab(currentTab, currentTabUrl);
        return;
      }
      if(kind === 'export'){
        const mod = uiBtn.getAttribute('data-access-module') || (currentTab === 'doors' ? 'door' : currentTab);
        const ttl = uiBtn.getAttribute('data-access-title') || (TAB_META[currentTab] ? TAB_META[currentTab].label : 'Export');
        if(window.zkActionModal && typeof window.zkActionModal.openCsvExport === 'function'){
          window.zkActionModal.openCsvExport(mod, `EXPORT – ${ttl}`, 'Export CSV (separator ;)');
        } else {
          window.location = `/agent/api/csv/${encodeURIComponent(String(mod))}/export/`;
        }
        return;
      }
      if(kind === 'import'){
        const mod = uiBtn.getAttribute('data-access-module') || 'access';
        const ttl = uiBtn.getAttribute('data-access-title') || (TAB_META[currentTab] ? TAB_META[currentTab].label : 'Import');
        openImportModal(mod, ttl);
        return;
      }
      if(kind === 'logs'){
        const mod = uiBtn.getAttribute('data-access-module') || 'access';
        const ttl = uiBtn.getAttribute('data-access-title') || (TAB_META[currentTab] ? TAB_META[currentTab].label : 'Loguri');
        openAccessAuditLogs(mod, ttl);
        return;
      }
    }
  });

  document.addEventListener('change', (e)=>{
    const manualSelect = e.target && e.target.closest ? e.target.closest('[data-wiegand-manual-select="1"]') : null;
    if(manualSelect){
      describeWiegandSelection();
      return;
    }

    const manualDoorSelect = e.target && e.target.closest ? e.target.closest('[data-wiegand-door-select="1"]') : null;
    if(manualDoorSelect){
      syncWiegandDoorSelection(manualDoorSelect.value, 'manual');
      return;
    }

    const testDoorSelect = e.target && e.target.closest ? e.target.closest('[data-wiegand-test-door="1"]') : null;
    if(testDoorSelect){
      syncWiegandDoorSelection(testDoorSelect.value, 'test');
      if(wiegandTestRunning){
        setWiegandTestStatus('Ușa de test s-a schimbat. Oprește și repornește testarea ca listenerul să folosească noul context.', false);
      }
      return;
    }
  });

  (function init(){
    const qs = new URLSearchParams(window.location.search);
    const tab = (qs.get('tab') || 'doors').toLowerCase();
    const initial = TAB_META[tab] ? tab : 'doors';
    loadTab(initial);
  })();
})();
</script>
