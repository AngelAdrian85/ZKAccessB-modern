<style>
  .access-modal-card{background:#0a1a27;border:1px solid #2f5876;border-radius:6px;padding:14px;}
  .access-modal-card h3{margin:0 0 12px 0;color:#9fd2f1;font-size:14px;}
  .access-modal-field{margin-bottom:10px;}
  .access-modal-card label{color:#e8f0f8;font-weight:600;font-size:11px;display:block;margin-bottom:4px;}
  .access-modal-card input,.access-modal-card select,.access-modal-card textarea{width:100%;background:#0f2433;border:1px solid #2f5876;color:#e8f0f8;border-radius:4px;padding:7px;font-size:11px;}
  .access-modal-actions{display:flex;gap:10px;margin-top:12px;justify-content:flex-end;}
  .access-btn{padding:7px 13px;border:none;border-radius:4px;font-size:11px;font-weight:900;cursor:pointer;color:#fff;text-decoration:none;display:inline-block;}
  .access-btn-primary{background:#3da5d9;}
  .access-btn-secondary{background:#2f5876;}
  .access-error{color:#ffbdbd;font-size:11px;margin-top:4px;}
</style>

<div class="access-modal-card">
  <h3>{% if obj %}Editează sărbătoare{% else %}Creează sărbătoare{% endif %}</h3>
  <form method="post" data-modal-form="1">
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="access-error">{{ form.non_field_errors }}</div>{% endif %}
    {% for f in form %}
      <div class="access-modal-field">
        {{ f.label_tag }}
        {{ f }}
        {% if f.errors %}<div class="access-error">{{ f.errors|striptags }}</div>{% endif %}
      </div>
    {% endfor %}
    <div class="access-modal-actions">
      <button type="button" class="access-btn access-btn-secondary" data-modal-close="1">Renunță</button>
      <button type="submit" class="access-btn access-btn-primary">Salvează</button>
    </div>
  </form>
</div>
