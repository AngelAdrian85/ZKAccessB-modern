<style>

  .access-saved p{margin:0;color:#e8f0f8;font-size:11px;}
  .access-saved .actions{margin-top:12px;display:flex;gap:10px;justify-content:flex-end;}

  .access-saved .btn-primary{background:#3da5d9;}

<div class="access-saved" data-access-saved="1">

  <div class="actions">
    <button type="button" class="btn btn-secondary" data-modal-close="1">Închide</button>

  </div>
</div>
